name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a push that supersedes another cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job a package, so a red build names the package and the other seven still report. Every package is typechecked
  # and tested on its own: a package that only compiles because another one happens to be installed is exactly what the
  # boundaries exist to prevent.
  package:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: kernel
          - package: ui
          - package: board
            coverage: true
          - package: frame
            coverage: true
          - package: view-media
          - package: view-map
          - package: view-shell
          - package: view-graph
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # `ci` and not `install`: the lockfile is the one the suite was run against, and a drift is a failure.
      - run: npm ci
      - run: npm --workspace @ssccsorg/skene-${{ matrix.package }} run typecheck
      - name: test
        if: ${{ !matrix.coverage }}
        run: npm --workspace @ssccsorg/skene-${{ matrix.package }} run test
      # The two packages whose logic is a set of decisions carry a floor. A change that stops reaching a line is a change
      # the suite has to explain.
      - name: test with coverage
        if: ${{ matrix.coverage }}
        run: npm --workspace @ssccsorg/skene-${{ matrix.package }} run test:coverage
      - uses: actions/upload-artifact@v5
        if: always() && matrix.coverage
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage
          retention-days: 7

  example:
    name: example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace @ssccsorg/skene-example run typecheck
      # This board's own assertions: its counts, its scenes, its queue. The frame's rules are held in the frame job.
      - run: npm --workspace @ssccsorg/skene-example run test
      # The board is copied beside the assets by this build, so a build that succeeds is a build that can be served.
      - run: npm --workspace @ssccsorg/skene-example run build
      - name: the build carries the board
        run: test -f examples/board/dist/projects.json && test -d examples/board/dist/scenario

  # The assembly a deployment performs, held to the two surfaces this repository cannot test for them: that every package
  # resolves from the workspace, and that the Layers table in the README holds as data.
  assembly:
    name: assembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: every workspace is installed
        run: npm ls --workspaces --depth=0
      # One table, every row: a package imports only a package above it, a picture imports no other picture, and a bare
      # import is a dependency the package declares. A package the table does not name is a failure.
      - name: the layer table holds
        run: npm run check:layers
